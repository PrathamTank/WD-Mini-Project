
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian ID Validator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000015;
        }

        h2 {
            text-align: center;
            color: #1e293b;
        }

        p {
            text-align: center;
            color: #64748b;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
        }

        .success {
            color: #15803d;
        }

        .error {
            color: #dc2626;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Indian ID Validator</h2>
        <p>Validate your details using JavaScript Regex</p>

        <form id="validatorForm">
            <label for="mobile">Mobile Number</label>
            <input
                type="text"
                id="mobile"
                placeholder="Enter 10-digit mobile number"
                maxlength="10"
                required
            >

            <label for="pan">PAN Card Number</label>
            <input
                type="text"
                id="pan"
                placeholder="ABCDE1234F"
                maxlength="10"
                required
            >

            <label for="aadhaar">Aadhaar Number</label>
            <input
                type="text"
                id="aadhaar"
                placeholder="Enter 12-digit Aadhaar number"
                maxlength="12"
                required
            >

            <button type="submit">Validate Details</button>
        </form>

        <div id="result" role="status" aria-live="polite"></div>
    </div>

    <script>
        const form = document.getElementById("validatorForm");
        const result = document.getElementById("result");

        // Regular expressions
        const mobileRegex = /^[6-9]\d{9}$/;
        const panRegex = /^[A-Z]{5}[0-9]{4}[A-Z]$/;
        const aadhaarRegex = /^[2-9]\d{11}$/;

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const mobile = document.getElementById("mobile")
                .value.trim();

            const pan = document.getElementById("pan")
                .value.trim().toUpperCase();

            const aadhaar = document.getElementById("aadhaar")
                .value.trim();

            const errors = [];

            if (!mobileRegex.test(mobile)) {
                errors.push("Invalid Indian mobile number.");
            }

            if (!panRegex.test(pan)) {
                errors.push("Invalid PAN card format.");
            }

            if (!aadhaarRegex.test(aadhaar)) {
                errors.push("Invalid Aadhaar number format.");
            }

            if (errors.length > 0) {
                result.className = "error";
                result.innerHTML = errors.join("<br>");
            } else {
                result.className = "success";
                result.textContent =
                    "All three details have valid formats!";
            }
        });
    </script>
</body>
</html>
